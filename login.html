<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Woofitos</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="CSS/style.css?v=7">
    <link rel="icon" href="IMG/favi.png" type="image/png">
</head>
<body>
    
    <div class="login-pantalla-dividida">
        
        <div class="login-lado-izquierdo">
            <img src="IMG/sesion.jpeg" alt="Fondo login Woofitos">
        </div>
        
        <div class="login-lado-derecho">
            <div class="login-form-container">
              <div class="login-header-bonito">
                  <a href="index.html" class="volver-inicio">← Volver al inicio</a>
                  <div class="logo-centrado">
                      <img src="IMG/logo.png" alt="Logo Woofitos" class="logo-bonito">
                  </div>
                  <h2>Cuenta Woofitos</h2>
              </div>
              
              <!-- Tab Navigation -->
              <div class="fender-switch">
                  <button id="btn-tab-login" class="fender-tab activa" onclick="mostrarFormulario('login')">Iniciar sesión</button>
                  <button id="btn-tab-registro" class="fender-tab" onclick="mostrarFormulario('registro')">Registrarse</button>
              </div>
              
              <!-- Login Form -->
              <form id="form-login" class="form-bonito" onsubmit="event.preventDefault(); enviarLogin();">
                  <div class="input-grupo-bonito">
                      <label>Correo Electrónico</label>
                      <input type="email" id="email-login" placeholder="ejemplo@correo.com" required>
                  </div>
                  <div class="input-grupo-bonito">
                      <label>Contraseña</label>
                      <div class="input-con-icono">
                          <input type="password" id="pass-login" placeholder="••••••••" required>
                          <img src="IMG/ojo_abierto.png" class="ver-password-bonito" onclick="togglePass('pass-login', this)">
                      </div>
                  </div>
                  <div class="form-opciones">
                      <label class="recordarme">
                          <input type="checkbox"><span>Recordarme</span>
                      </label>
                      <a href="#" class="olvide-password" onclick="iniciarRecuperacion()">¿Olvidaste tu contraseña?</a>
                  </div>
                  <button type="submit" class="btn-login-bonito">Iniciar Sesión</button>
              </form>
              
              <!-- Registration Form -->
              <form id="form-registro" class="form-bonito" style="display: none;" onsubmit="event.preventDefault(); enviarRegistro();">
                  <div class="input-grupo-bonito">
                      <label>Tu Nombre</label>
                      <input type="text" id="nombre-reg" placeholder="Ej. David" required>
                  </div>
                  <div class="input-grupo-bonito">
                      <label>Nombre de tu Mascota 🐾</label>
                      <input type="text" id="mascota-reg" placeholder="Ej. Firulais" required>
                  </div>
                  <div class="input-grupo-bonito">
                      <label>Correo Electrónico</label>
                      <input type="email" id="email-reg" placeholder="ejemplo@correo.com" required>
                  </div>
                  <div class="input-grupo-bonito">
                      <label>Crea una Contraseña</label>
                      <div class="input-con-icono">
                          <input type="password" id="pass-reg" placeholder="••••••••" required>
                          <img src="IMG/ojo_abierto.png" class="ver-password-bonito" onclick="togglePass('pass-reg', this)">
                      </div>
                  </div>
                  <button type="submit" class="btn-login-bonito">Crear Cuenta</button>
              </form>
              
              <!-- Form Logic & Authentication -->
              <script>
                  function mostrarFormulario(tipo) {
                      const formLogin = document.getElementById('form-login');
                      const formReg = document.getElementById('form-registro');
                      const btnLogin = document.getElementById('btn-tab-login');
                      const btnReg = document.getElementById('btn-tab-registro');
              
                      if (tipo === 'registro') {
                          formLogin.style.display = 'none';
                          formReg.style.display = 'block';
                          btnReg.classList.add('activa');
                          btnLogin.classList.remove('activa');
                      } else {
                          formReg.style.display = 'none';
                          formLogin.style.display = 'block';
                          btnLogin.classList.add('activa');
                          btnReg.classList.remove('activa');
                      }
                  }
              
                  function togglePass(inputId, imgElement) {
                      const input = document.getElementById(inputId);
                      if (input.type === 'password') {
                          input.type = 'text';
                          imgElement.src = 'IMG/ojo_cerrado.png';
                      } else {
                          input.type = 'password';
                          imgElement.src = 'IMG/ojo_abierto.png';
                      }
                  }
                  
                  // LocalStorage is used for demonstration purposes. Backend integration is disabled in this mockup.
                  function enviarRegistro() {
                      const mascota = document.getElementById('mascota-reg').value;
                      const email = document.getElementById('email-reg').value;
                      
                      localStorage.setItem("mascotaWoofitos", mascota);
                      localStorage.setItem("emailWoofitos", email);
                      window.location.href = "index.html";
                  }
                  
                  function enviarLogin() {
                      const email = document.getElementById('email-login').value;
                      
                      localStorage.setItem("mascotaWoofitos", "Demo Dog");
                      localStorage.setItem("emailWoofitos", email);
                      window.location.href = "index.html";
                  }

                  function iniciarRecuperacion() {
                      const email = prompt("Escribe tu correo electrónico para buscar tu cuenta:");
                      if (!email) return;
                      
                      const mascota = prompt("Pregunta de seguridad:\n¿Cómo se llama la mascota que registraste en esa cuenta?");
                      if (!mascota) return;
                      
                      alert("Identidad confirmada (Modo Demostración)\n\nTu contraseña temporal es: demopass123");
                  }
              </script>
            </div>
        </div>
    </div>
</body>
</html>
